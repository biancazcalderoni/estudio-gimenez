<html lang="es">

    * { box-sizing: border-box; }
    body {
      margin: 0;

      color: #2c3e50;

    }

    .user-profile-label {

    }
    .user-profile-name {

      padding: 0 12px;
    }
    .menu-item {
      padding: 12px 16px;
      border-radius: 6px;

      color: rgba(255,255,255,0.8);

      flex: 1;

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: all 0.2s;
      cursor: pointer;
    }
    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transform: translateY(-2px);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #2c3e50;
    }
    .card-meta {
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 8px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-active { background: #d4af37; color: #2c3e50; }
    .badge-pending { background: #3498db; color: white; }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .table th {
      background: #f8f9fa;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #7f8c8d;
      border-bottom: 2px solid #e0e0e0;
    }
    .table td {
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    .table tr:hover {
      background: #f8f9fa;
      cursor: pointer;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      max-width: 900px;
      width: 90%;
      max-height: 80vh;
      display: grid;
      grid-template-columns: 1fr 350px;
      overflow: hidden;
    }
    .modal-body {
      padding: 32px;
      overflow-y: auto;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #2c3e50;
    }
    .modal-sidebar {
      background: #f8f9fa;
      border-left: 1px solid #e0e0e0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 300px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      max-width: 85%;
    }
    .message.user {
      background: #2c5aa0;
      color: white;
      margin-left: auto;
    }
    .message.assistant {
      background: #e8f4f8;
      color: #2c3e50;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    .input-group input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
    }
    .input-group button {
      padding: 10px 16px;
      background: #2c5aa0;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .hidden { display: none; }
    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .modal-content { grid-template-columns: 1fr; }
      .modal-sidebar { display: none; }
    }
  </style>
</head>

      if (!state.currentUser) {
        root.innerHTML = `
          <div style="display: grid; place-items: center; min-height: 100vh; background: linear-gradient(135deg, #2c5aa0 0%, #1f3f6b 100%);">
            <div style="background: white; padding: 40px; border-radius: 12px; text-align: center;">
              <div style="font-size: 32px; font-weight: 700; color: #2c5aa0; margin-bottom: 10px;">GIMENEZ</div>
              <p style="color: #7f8c8d; margin-bottom: 32px;">Estudio Jurídico</p>
              <div style="display: grid; gap: 12px;">
                <button class="btn btn-primary" onclick="setState({currentUser: 'juan'})" style="width: 300px; padding: 12px;">Juan Manuel Gimenez</button>
                <button class="btn btn-primary" onclick="setState({currentUser: 'fabian'})" style="width: 300px; padding: 12px;">Fabián Gimenez</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="app">
          <div class="sidebar">
            <div>
              <div class="logo">GIMENEZ</div>
              <div class="logo-sub">ESTUDIO JURÍDICO</div>
            </div>

            <div class="user-profile">
              <div class="user-profile-label">USUARIO</div>
              <div class="user-profile-name">${state.currentUser === 'juan' ? 'Juan Manuel' : 'Fabián'}</div>
              <div class="user-profile-role">${state.currentUser === 'juan' ? 'Abogado Principal' : 'Abogado Asociado'}</div>
            </div>

            <div class="menu">
              <div class="menu-item ${state.currentView === 'dashboard' ? 'active' : ''}" onclick="setState({currentView: 'dashboard', selectedCase: null})">Dashboard</div>
              <div class="menu-item ${state.currentView === 'clientes' ? 'active' : ''}" onclick="setState({currentView: 'clientes', selectedCase: null})">Clientes</div>
              <div class="menu-item ${state.currentView === 'casos' ? 'active' : ''}" onclick="setState({currentView: 'casos', selectedCase: null})">Casos</div>
              <div class="menu-item ${state.currentView === 'expedientes' ? 'active' : ''}" onclick="setState({currentView: 'expedientes', selectedCase: null})">Expedientes</div>
              <div class="menu-item ${state.currentView === 'tareas' ? 'active' : ''}" onclick="setState({currentView: 'tareas', selectedCase: null})">Tareas</div>
              <div class="menu-item ${state.currentView === 'finanzas' ? 'active' : ''}" onclick="setState({currentView: 'finanzas', selectedCase: null})">Finanzas</div>
              <div class="menu-item ${state.currentView === 'baseLegal' ? 'active' : ''}" onclick="setState({currentView: 'baseLegal', selectedCase: null})">Base Legal</div>
              <div class="menu-item ${state.currentView === 'calendario' ? 'active' : ''}" onclick="setState({currentView: 'calendario', selectedCase: null})">Calendario</div>
            </div>

            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding: 0 12px;">
              <button class="btn btn-secondary" onclick="setState({currentUser: null})" style="width: 100%;">Cerrar sesión</button>
            </div>
          </div>

          <div class="main">
            <div class="header">
              <h1>${
                state.currentView === 'dashboard' ? 'Dashboard' :
                state.currentView === 'clientes' ? 'Clientes' :
                state.currentView === 'casos' ? 'Casos' :
                state.currentView === 'expedientes' ? 'Expedientes' :
                state.currentView === 'baseLegal' ? 'Base Legal Argentina' :
                'Calendario'
              }</h1>
              <div style="display: flex; gap: 12px; align-items: center;">
                <button class="btn btn-secondary" onclick="setState({configDialog: true})" style="padding: 10px 12px;">⚙</button>
                ${state.currentView === 'clientes' ? `<button class="btn btn-primary" onclick="setState({newClientDialog: true})">+ Nuevo Cliente</button>` : ''}
                ${state.currentView === 'casos' ? `<button class="btn btn-primary" onclick="setState({newCaseDialog: true})">+ Nuevo Caso</button>` : ''}
                ${state.currentView === 'expedientes' ? `<button class="btn btn-primary" onclick="setState({newExpedienteDialog: true})">+ Nuevo Expediente</button>` : ''}
                ${state.currentView === 'baseLegal' ? `<button class="btn btn-primary" onclick="setState({newLegalDocDialog: true})">+ Agregar Documento</button>` : ''}
              </div>
            </div>

            <div class="content">
              ${state.currentView === 'dashboard' ? renderDashboard() : ''}
              ${state.currentView === 'clientes' ? renderClientes() : ''}
              ${state.currentView === 'casos' ? renderCasos() : ''}
              ${state.currentView === 'expedientes' ? renderExpedientes() : ''}
              ${state.currentView === 'tareas' ? renderTareas() : ''}
              ${state.currentView === 'finanzas' ? renderFinanzas() : ''}
              ${state.currentView === 'baseLegal' ? renderBaseLegal() : ''}
              ${state.currentView === 'calendario' ? renderCalendario() : ''}
            </div>
          </div>
        </div>

        ${state.selectedCaseDetail ? renderCaseDetail() : ''}
        ${state.selectedCase && !state.selectedCaseDetail ? renderCaseModal() : ''}
        ${state.selectedClient ? renderClientModal() : ''}
        ${state.selectedExpediente ? renderExpedienteModal() : ''}
        ${state.activePromptDialog ? renderPromptDialog() : ''}
        ${state.newClientDialog ? renderNewClientDialog() : ''}
        ${state.editClientDialog ? renderEditClientDialog() : ''}
        ${state.newCaseDialog ? renderNewCaseDialog() : ''}
        ${state.editCaseDialog ? renderEditCaseDialog() : ''}
        ${state.newExpedienteDialog ? renderNewExpedienteDialog() : ''}
        ${state.editExpedienteDialog ? renderEditExpedienteDialog() : ''}
        ${state.newTareaDialog ? renderNewTareaDialog() : ''}
        ${state.editTareaDialog ? renderEditTareaDialog() : ''}
        ${state.newLegalDocDialog ? renderNewLegalDocDialog() : ''}
        ${state.configDialog ? renderConfigDialog() : ''}
        ${state.monthlyReportDialog ? renderMonthlyReportDialog() : ''}
        ${state.documentViewer ? renderDocumentViewer() : ''}
      `;
    }

    function renderDashboard() {
      const proximaCita = mockCitas.sort((a, b) => new Date(a.fecha) - new Date(b.fecha))[0];
      const fechaFormato = new Date(proximaCita.fecha).toLocaleDateString('es-AR', {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'});

      const totalCobrado = state.data.finanzas.filter(f => f.estado === 'cobrado').reduce((sum, f) => sum + f.monto, 0);
      const totalPendiente = state.data.finanzas.filter(f => f.estado === 'pendiente').reduce((sum, f) => sum + f.monto, 0);
      const tareasActivas = state.data.tareas.filter(t => t.estado !== 'completada').length;
      const expedienteTotal = state.data.expedientes.length;

      return `
        <div style="margin-bottom: 24px;">
          <div style="background: linear-gradient(135deg, #2c5aa0 0%, #1f3f6b 100%); border-radius: 12px; padding: 24px; color: white; box-shadow: 0 4px 16px rgba(0,0,0,0.15);">
            <div style="font-size: 12px; opacity: 0.9; margin-bottom: 8px; letter-spacing: 0.5px; text-transform: uppercase;">PRÓXIMA CITA</div>
            <h2 style="margin: 0 0 12px 0; font-size: 24px; font-weight: 700;">${proximaCita.caso}</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 16px;">
              <div>
                <div style="font-size: 11px; opacity: 0.8; margin-bottom: 4px;">FECHA Y HORA</div>
                <div style="font-size: 16px; font-weight: 600;">${fechaFormato} • ${proximaCita.hora}</div>
              </div>
              <div>
                <div style="font-size: 11px; opacity: 0.8; margin-bottom: 4px;">UBICACIÓN</div>
                <div style="font-size: 16px; font-weight: 600;">${proximaCita.lugar}</div>
              </div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
              <div>
                <div style="font-size: 11px; opacity: 0.8; margin-bottom: 4px;">TIPO</div>
                <div style="font-size: 14px; font-weight: 500; background: rgba(255,255,255,0.2); padding: 6px 12px; border-radius: 6px; display: inline-block;">${proximaCita.tipo}</div>
              </div>
            </div>
          </div>
        </div>

        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 24px;">
          <div class="card"><div class="card-title">Casos Activos</div><div style="font-size: 32px; font-weight: 700; color: #d4af37; margin: 12px 0;">${state.data.casos.length}</div></div>
          <div class="card"><div class="card-title">Clientes</div><div style="font-size: 32px; font-weight: 700; color: #d4af37; margin: 12px 0;">${state.data.clientes.length}</div></div>
          <div class="card"><div class="card-title">Expedientes</div><div style="font-size: 32px; font-weight: 700; color: #3498db; margin: 12px 0;">${expedienteTotal}</div></div>
          <div class="card"><div class="card-title">Tareas Pendientes</div><div style="font-size: 32px; font-weight: 700; color: #e74c3c; margin: 12px 0;">${tareasActivas}</div></div>
          <div class="card"><div class="card-title">Cobrado</div><div style="font-size: 32px; font-weight: 700; color: #27ae60; margin: 12px 0;">$${totalCobrado.toLocaleString()}</div></div>
          <div class="card"><div class="card-title">Pendiente de Cobro</div><div style="font-size: 32px; font-weight: 700; color: #e74c3c; margin: 12px 0;">$${totalPendiente.toLocaleString()}</div></div>
        </div>

        <div style="background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px;">
          <h3 style="margin: 0 0 16px 0; color: #2c5aa0;">Próximos Movimientos</h3>
          <table class="table">
            <thead><tr><th>Caso</th><th>Cliente</th><th>Tipo</th><th>Estado</th></tr></thead>
            <tbody>
              ${state.data.casos.slice(0, 3).map(c => `<tr onclick="setState({selectedCase: ${JSON.stringify(c).replace(/"/g, '&quot;')}})"><td style="font-weight: 600; cursor: pointer;">${c.titulo}</td><td>${c.cliente}</td><td>${c.tipo}</td><td><span class="badge badge-${c.estado === 'activo' ? 'active' : 'pending'}">${c.estado}</span></td></tr>`).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderClientes() {
      let clientesFiltrados = state.data.clientes.filter(c => c.name.toLowerCase().includes(state.searchClients.toLowerCase()));

      if (state.sortClients === 'recent') {
        clientesFiltrados.sort((a, b) => new Date(b.fecha) - new Date(a.fecha));
      } else if (state.sortClients === 'old') {
        clientesFiltrados.sort((a, b) => new Date(a.fecha) - new Date(b.fecha));
      } else if (state.sortClients === 'alpha') {
        clientesFiltrados.sort((a, b) => a.name.localeCompare(b.name));
      }

      return `
        <div style="margin-bottom: 24px;">
          <div style="display: flex; gap: 12px; margin-bottom: 16px;">
            <input type="text" placeholder="Buscar cliente..." value="${state.searchClients}" onkeyup="setState({searchClientes: this.value})" style="flex: 1; padding: 12px 16px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px;">
            <select onchange="setState({sortClients: this.value})" style="padding: 12px 16px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; background: white; color: #2c3e50;">
              <option value="recent">Más recientes</option>
              <option value="old">Más antiguos</option>
              <option value="alpha">Abecedario</option>
            </select>
          </div>

          <div style="display: flex; gap: 8px; flex-wrap: wrap;">
            <button class="btn ${!state.filtroFueroClientes ? 'btn-primary' : 'btn-secondary'}" onclick="setState({filtroFueroClientes: null})" style="padding: 10px 16px; font-size: 12px;">Todos</button>
            <button class="btn ${state.filtroFueroClientes === 'civil' ? 'btn-primary' : 'btn-secondary'}" onclick="setState({filtroFueroClientes: 'civil'})" style="padding: 10px 16px; font-size: 12px;">Civil</button>
            <button class="btn ${state.filtroFueroClientes === 'penal' ? 'btn-primary' : 'btn-secondary'}" onclick="setState({filtroFueroClientes: 'penal'})" style="padding: 10px 16px; font-size: 12px;">Penal</button>
            <button class="btn ${state.filtroFueroClientes === 'administrativo' ? 'btn-primary' : 'btn-secondary'}" onclick="setState({filtroFueroClientes: 'administrativo'})" style="padding: 10px 16px; font-size: 12px;">Administrativo</button>
          </div>
        </div>

        <div class="grid">
          ${clientesFiltrados.length > 0 ? clientesFiltrados.map(c => `<div class="card"><div onclick="setState({selectedClient: ${JSON.stringify(c).replace(/"/g, '&quot;')}})" style="cursor: pointer;"><div class="card-title">${c.name}</div><div class="card-meta">Email: ${c.email}</div><div class="card-meta">Teléfono: ${c.phone}</div><div style="margin-top: 12px; color: #d4af37; font-weight: 600;">${c.casos} caso(s)</div></div><div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #e0e0e0; display: flex; gap: 8px;"><button class="btn btn-secondary" onclick="setState({editingClient: ${JSON.stringify(c).replace(/"/g, '&quot;')}, editClientDialog: true})" style="flex: 1; padding: 8px; font-size: 12px;">Editar</button><button class="btn btn-secondary" onclick="if(confirm('¿Eliminar cliente ${c.name}?')) window.deleteClient(${c.id})" style="flex: 1; padding: 8px; font-size: 12px; color: #e74c3c;">Eliminar</button></div></div>`).join('') : '<div style="grid-column: 1/-1; text-align: center; color: #7f8c8d; padding: 40px;">No se encontraron clientes</div>'}
        </div>
      `;
    }

    function renderCasos() {
      const getFueroColor = (fuero) => fuero === 'penal' ? '#e74c3c' : fuero === 'administrativo' ? '#27ae60' : '#3498db';

      let casosFiltrados = state.data.casos;
      if (state.filtroFueroCasos) {
        casosFiltrados = casosFiltrados.filter(c => c.fuero === state.filtroFueroCasos);
      }

      return `
        <div style="margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap;">
          <button class="btn ${!state.filtroFueroCasos ? 'btn-primary' : 'btn-secondary'}" onclick="setState({filtroFueroCasos: null})" style="padding: 10px 16px; font-size: 12px;">Todos (${state.data.casos.length})</button>
          <button class="btn ${state.filtroFueroCasos === 'civil' ? 'btn-primary' : 'btn-secondary'}" onclick="setState({filtroFueroCasos: 'civil'})" style="padding: 10px 16px; font-size: 12px;">Civil</button>
          <button class="btn ${state.filtroFueroCasos === 'penal' ? 'btn-primary' : 'btn-secondary'}" onclick="setState({filtroFueroCasos: 'penal'})" style="padding: 10px 16px; font-size: 12px;">Penal</button>
          <button class="btn ${state.filtroFueroCasos === 'administrativo' ? 'btn-primary' : 'btn-secondary'}" onclick="setState({filtroFueroCasos: 'administrativo'})" style="padding: 10px 16px; font-size: 12px;">Administrativo</button>
        </div>

        <table class="table">
          <thead><tr><th>Caso</th><th>Cliente</th><th>Tipo</th><th>Fuero</th><th>Estado</th><th>Fecha</th><th>Acciones</th></tr></thead>
          <tbody>
            ${casosFiltrados.map(c => `<tr><td onclick="setState({selectedCase: ${JSON.stringify(c).replace(/"/g, '&quot;')}})" style="font-weight: 600; cursor: pointer;">${c.titulo}</td><td>${c.cliente}</td><td>${c.tipo}</td><td><span style="display: inline-block; padding: 4px 8px; border-radius: 4px; background: ${getFueroColor(c.fuero)}; color: white; font-size: 11px; font-weight: 600;">${c.fuero.charAt(0).toUpperCase() + c.fuero.slice(1)}</span></td><td><span class="badge badge-${c.estado === 'activo' ? 'active' : c.estado === 'pending' ? 'pending' : 'active'}">${c.estado}</span></td><td>${c.fecha}</td><td><button class="btn btn-secondary" onclick="setState({editingCase: ${JSON.stringify(c).replace(/"/g, '&quot;')}, editCaseDialog: true})" style="padding: 6px 10px; font-size: 11px; margin-right: 4px;">Editar</button><button class="btn btn-secondary" onclick="if(confirm('¿Eliminar caso ${c.titulo}?')) window.deleteCase(${c.id})" style="padding: 6px 10px; font-size: 11px; color: #e74c3c;">Eliminar</button></td></tr>`).join('')}
          </tbody>
        </table>
      `;
    }

    function renderExpedientes() {
      return `
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));">
          ${state.data.expedientes.map(exp => `
            <div class="card">
              <div onclick="setState({selectedExpediente: ${JSON.stringify(exp).replace(/"/g, '&quot;')}})" style="cursor: pointer;">
                <div class="card-title">${exp.titulo}</div>
                <div class="card-meta">Caso: ${exp.caso}</div>
                <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #e0e0e0;">
                  <div style="font-size: 12px; font-weight: 600; color: #2c5aa0; margin-bottom: 4px;">PARTES</div>
                  <div style="font-size: 12px; color: #555;">Demandante: ${exp.demandante.nombre}</div>
                  <div style="font-size: 12px; color: #555;">Demandado: ${exp.demandado.nombre}</div>
                </div>
                <div style="margin-top: 12px;">
                  <div style="font-size: 11px; font-weight: 600; color: #7f8c8d;">${exp.testigos.length} testigo(s) • ${exp.pliegos.length} pregunta(s)</div>
                </div>
              </div>
              <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #e0e0e0; display: flex; gap: 8px;">
                <button class="btn btn-secondary" onclick="setState({editingExpediente: ${JSON.stringify(exp).replace(/"/g, '&quot;')}, editExpedienteDialog: true})" style="flex: 1; padding: 8px; font-size: 12px;">Editar</button>
                <button class="btn btn-secondary" onclick="if(confirm('¿Eliminar expediente ${exp.titulo}?')) window.deleteExpediente(${exp.id})" style="flex: 1; padding: 8px; font-size: 12px; color: #e74c3c;">Eliminar</button>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderTareas() {
      const getEstadoColor = (estado) => estado === 'completada' ? '#27ae60' : estado === 'en progreso' ? '#f39c12' : '#e74c3c';
      const getNombreResponsable = (resp) => resp === 'juan' ? 'Juan Manuel' : 'Fabián';

      return `
        <div style="margin-bottom: 20px;">
          <button class="btn btn-primary" onclick="setState({newTareaDialog: true})" style="margin-bottom: 20px;">+ Nueva Tarea</button>
        </div>
        <div>
          <table class="table" style="margin-bottom: 20px;">
            <thead>
              <tr>
                <th>Tarea</th>
                <th>Responsable</th>
                <th>Fecha Límite</th>
                <th>Prioridad</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody>
              ${state.data.tareas.map(tarea => `
                <tr>
                  <td style="font-weight: 600;">${tarea.titulo}</td>
                  <td><span style="display: inline-block; padding: 4px 8px; background: #e8f4f8; border-radius: 4px; font-size: 12px; font-weight: 600;">${getNombreResponsable(tarea.responsable)}</span></td>
                  <td>${tarea.fechaLimite}</td>
                  <td><span style="display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; background: ${tarea.prioridad === 'alta' ? '#ffe8e8' : '#fff4e8'}; color: ${tarea.prioridad === 'alta' ? '#c0392b' : '#d68910'};"><strong>${tarea.prioridad.charAt(0).toUpperCase() + tarea.prioridad.slice(1)}</strong></span></td>
                  <td><span class="badge" style="background: ${getEstadoColor(tarea.estado)}; color: white;">${tarea.estado}</span></td>
                  <td><button class="btn btn-secondary" onclick="setState({editingTarea: ${JSON.stringify(tarea).replace(/"/g, '&quot;')}, editTareaDialog: true})" style="padding: 6px 10px; font-size: 11px; margin-right: 4px;">Editar</button><button class="btn btn-secondary" onclick="if(confirm('¿Eliminar tarea?')) window.deleteTarea(${tarea.id}); render();" style="padding: 6px 10px; font-size: 11px; color: #e74c3c;">Eliminar</button></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;
    }

    function renderFinanzas() {
      const totalCobrado = state.data.finanzas.filter(f => f.estado === 'cobrado').reduce((sum, f) => sum + f.monto, 0);
      const totalPendiente = state.data.finanzas.filter(f => f.estado === 'pendiente').reduce((sum, f) => sum + f.monto, 0);
      const total = totalCobrado + totalPendiente;
      const porcentajeCobrado = ((totalCobrado / total) * 100).toFixed(1);

      return `
        <div>
          <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 24px;">
            <div class="card">
              <div class="card-title">Total Cobrado</div>
              <div style="font-size: 32px; font-weight: 700; color: #27ae60; margin: 12px 0;">$${totalCobrado.toLocaleString()}</div>
              <div style="font-size: 12px; color: #7f8c8d;">${porcentajeCobrado}% del total</div>
            </div>
            <div class="card">
              <div class="card-title">Pendiente de Cobro</div>
              <div style="font-size: 32px; font-weight: 700; color: #e74c3c; margin: 12px 0;">$${totalPendiente.toLocaleString()}</div>
              <div style="font-size: 12px; color: #7f8c8d;">${(100 - porcentajeCobrado)}% del total</div>
            </div>
            <div class="card">
              <div class="card-title">Total Presupuestado</div>
              <div style="font-size: 32px; font-weight: 700; color: #2c5aa0; margin: 12px 0;">$${total.toLocaleString()}</div>
              <div style="font-size: 12px; color: #7f8c8d;">Cobrado + Pendiente</div>
            </div>
          </div>

          <div style="background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 24px;">
            <h3 style="margin: 0 0 20px 0; color: #2c5aa0;">Estado de Cobros</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 30px; align-items: center;">
              <div>
                <div style="text-align: center; margin-bottom: 20px;">
                  <div style="width: 200px; height: 200px; margin: 0 auto; background: conic-gradient(#27ae60 0% ${porcentajeCobrado}%, #e74c3c ${porcentajeCobrado}% 100%); border-radius: 50%; position: relative; display: flex; align-items: center; justify-content: center;">
                    <div style="width: 160px; height: 160px; background: white; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                      <div style="font-size: 28px; font-weight: 700; color: #2c5aa0;">${porcentajeCobrado}%</div>
                      <div style="font-size: 11px; color: #7f8c8d;">Cobrado</div>
                    </div>
                  </div>
                </div>
              </div>
              <div>
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                  <div style="width: 20px; height: 20px; background: #27ae60; border-radius: 4px;"></div>

    function sendLegalConsulta() {
      const input = document.getElementById('legalChatInput');
      if (!input || !input.value.trim()) return;

      const userMessage = input.value.trim();
      input.value = '';

      setState({
        legalChatMessages: [...state.legalChatMessages, { type: 'user', text: userMessage }]
      });

      const mockResponses = {
        'plazo': 'Según el Código Procesal Civil y Comercial, los plazos para contestar una demanda generalmente son de 10 días hábiles, contados desde la notificación.',
        'incumplimiento': 'El Código Civil y Comercial define el incumplimiento como el acto de no ejecutar una obligación en tiempo y forma. El acreedor puede exigir el cumplimiento o la indemnización de daños.',
        'demanda': 'Una demanda es el acto procesal mediante el cual se promueve la acción ante el tribunal. Debe contener la pretensión, los hechos y el fundamento legal.',
        'default': 'Consulta registrada. Para obtener una respuesta completa, conecta el endpoint /api/chat con Claude Opus 5.5. Puedo ayudarte a revisar documentos y redactar escritos.'
      };

      let mockResponse = mockResponses.default;
      const lowerMsg = userMessage.toLowerCase();
      for (const [key, response] of Object.entries(mockResponses)) {
        if (lowerMsg.includes(key)) {
          mockResponse = response;
          break;
        }
      }

      fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'legal',
          messages: [{ role: 'user', content: userMessage }]
        })
      })
      .then(res => res.json())
      .then(data => {
        setState({
          legalChatMessages: [...state.legalChatMessages, { type: 'assistant', text: data.message || mockResponse }]
        });
      })
      .catch(err => {
        setState({
          legalChatMessages: [...state.legalChatMessages, { type: 'assistant', text: mockResponse }]
        });
      });
    }

      fetch('/api/chat', {

      return `
        <div class="modal" onclick="if(event.target === this) setState({documentViewer: null})" style="z-index: 10000;">
          <div class="modal-content" style="width: 90%; height: 90%; max-width: 1200px; padding: 0; display: flex; flex-direction: column; border-radius: 12px;">

              <div style="display: flex; gap: 10px; align-items: center;">
                <span style="font-size: 12px; opacity: 0.8;">${doc.type}</span>
                <button class="btn btn-secondary" onclick="const a=document.createElement('a'); a.href='${doc.url}'; a.download='${doc.name}'; a.click();" style="padding: 8px 16px; background: rgba(255,255,255,0.2); border: none; color: white; border-radius: 6px; cursor: pointer;">⬇️ Descargar</button>

              </div>
            </div>
            <div style="flex: 1; overflow: auto; display: flex; align-items: center; justify-content: center; background: #f5f5f5;">
              ${isImage ? '<img src="' + doc.url + '" style="max-width: 100%; max-height: 100%; object-fit: contain;" alt="' + doc.name + '">' :
                isPdf ? '<iframe src="' + doc.url + '#toolbar=0&navpanes=0&scrollbar=1" style="width: 100%; height: 100%; border: none;"></iframe>' :
                '<div style="text-align: center; color: #7f8c8d; padding: 40px;"><div style="font-size: 48px; margin-bottom: 20px;">📄</div><div style="font-size: 16px; margin-bottom: 20px;">No se puede previsualizar este tipo de archivo</div><button class="btn btn-primary" onclick="const a=document.createElement(\'a\'); a.href=\'' + doc.url + '\'; a.download=\'' + doc.name + '\'; a.click();">Descargar archivo</button></div>'}
            </div>
          </div>
        </div>
      `;
    }

            <h2 style="margin-top: 0; color: #2c5aa0;">⚙️ Configuración</h2>

            <div style="margin-bottom: 24px;">
              <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #2c3e50;">API Key de Claude</label>
              <p style="font-size: 12px; color: #7f8c8d; margin-top: 0; margin-bottom: 12px;">
                Obtén tu API key en <a href="https://console.anthropic.com/" target="_blank" style="color: #2c5aa0; text-decoration: none;">console.anthropic.com</a>
              </p>
              <input
                type="password"
                id="apiKeyInput"
                placeholder="sk-ant-..."
                value="${state.apiKey}"
                style="width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: monospace;"
              >
            </div>

            <div style="display: flex; gap: 12px;">
              <button class="btn btn-primary" onclick="
                const key = document.getElementById('apiKeyInput').value;
                localStorage.setItem('anthropic_api_key', key);
                setState({apiKey: key, configDialog: false});
              " style="flex: 1;">💾 Guardar</button>
              <button class="btn btn-secondary" onclick="setState({configDialog: false})" style="flex: 1;">Cerrar</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderMonthlyReportDialog() {
      return `
        <div class="modal" onclick="if(event.target === this) setState({monthlyReportDialog: false})">
          <div style="background: white; border-radius: 12px; padding: 32px; max-width: 700px; width: 90%; max-height: 90vh; overflow-y: auto;" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
              <h2 style="margin: 0; color: #2c5aa0;">📧 Informe Mensual - ${new Date().toLocaleDateString('es-AR', {month: 'long', year: 'numeric'})}</h2>
              <button class="close-btn" onclick="setState({monthlyReportDialog: false})">✕</button>
            </div>

            <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 24px;">
              <h3 style="margin: 0 0 12px 0; color: #2c5aa0; font-size: 14px;">📋 PREVIEW DEL INFORME</h3>
              <div style="background: white; padding: 16px; border-radius: 6px; font-size: 13px; line-height: 1.6; color: #555;">
                <p style="margin: 0 0 12px 0;"><strong>Cliente:</strong> ${state.selectedClient.name}</p>
                <p style="margin: 0 0 12px 0;"><strong>Período:</strong> ${new Date().toLocaleDateString('es-AR', {month: 'long', year: 'numeric'})}</p>
                <p style="margin: 0 0 12px 0;"><strong>Casos Activos:</strong> ${state.selectedClient.casos}</p>
                <hr style="border: none; border-top: 1px solid #e0e0e0; margin: 12px 0;">
                <p style="margin: 0;"><strong>Resumen:</strong> Se adjunta informe detallado con estado de los casos, próximas actuaciones y recomendaciones legales.</p>
              </div>
            </div>

            <div style="margin-bottom: 24px;">
              <label style="display: block; font-size: 11px; font-weight: 600; color: #7f8c8d; margin-bottom: 8px; text-transform: uppercase;">NOTAS ADICIONALES (opcional)</label>
              <textarea placeholder="Agregar detalles específicos para este informe..." style="width: 100%; min-height: 100px; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 13px; resize: vertical;"></textarea>
            </div>

            <div style="background: #e8f4f8; padding: 16px; border-radius: 8px; margin-bottom: 24px; border-left: 4px solid #2c5aa0;">
              <h4 style="margin: 0 0 8px 0; color: #2c5aa0; font-size: 12px;">⚙️ FLUJO DE APROBACIÓN</h4>
              <div style="font-size: 12px; color: #555; line-height: 1.6;">
                <p style="margin: 4px 0;">✅ <strong>Paso 1:</strong> Enviar al correo del abogado (${state.currentUser === 'juan' ? 'juan@estudiogimenez.ar' : 'fabian@estudiogimenez.ar'})</p>
                <p style="margin: 4px 0;">⏳ <strong>Paso 2:</strong> Abogado revisa y confirma</p>
                <p style="margin: 4px 0;">📧 <strong>Paso 3:</strong> Se envía automáticamente al cliente (${state.selectedClient.email})</p>
              </div>
            </div>

            <div style="display: flex; gap: 12px;">
              <button class="btn btn-primary" onclick="sendMonthlyReport()" style="flex: 1; padding: 12px;">📧 Enviar al Abogado para Aprobación</button>
              <button class="btn btn-secondary" onclick="setState({monthlyReportDialog: false})" style="flex: 1; padding: 12px;">Cancelar</button>
            </div>
          </div>
        </div>
      `;
    }

    function sendMonthlyReport() {
      setState({
        monthlyReportDialog: false,
        monthlyReportStatus: 'Enviado al abogado - Pendiente de aprobación'
      });
      alert(`✅ Informe enviado a ${state.currentUser === 'juan' ? 'Juan Manuel' : 'Fabián'}\n\n📧 El abogado recibirá un email para revisar y confirmar.\n\nUna vez aprobado, se reenviará automáticamente a:\n${state.selectedClient.email}`);
    }

    function sendClientMessage() {
      const input = document.getElementById('clientChatInput');
      if (input && input.value.trim()) {
        setState({
          clientChatMessages: [...state.clientChatMessages, { type: 'user', text: input.value }]
        });
        input.value = '';
        setTimeout(() => {
          setState({
            clientChatMessages: [...state.clientChatMessages, { type: 'assistant', text: '✍️ Analizando cliente... (IA conectada próximamente)' }]
          });
        }, 500);
      }
    }

    render();
  </script>
</body>
</html>
