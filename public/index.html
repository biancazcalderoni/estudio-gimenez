<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio Jurídico Gimenez</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #2c3e50;
    }

    .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .sidebar {
      background: linear-gradient(180deg, #2c5aa0 0%, #1f3f6b 100%);
      color: white;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 32px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    }
    .logo {
      padding: 0 20px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .logo-sub {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
    .user-profile {
      padding: 12px 20px;
      margin: 0 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      font-size: 12px;
    }
    .user-profile-label {
      opacity: 0.8;
      margin-bottom: 4px;
    }
    .user-profile-name {
      font-weight: 600;
      font-size: 14px;
      margin-top: 2px;
    }
    .user-profile-role {
      color: #d4af37;
      font-size: 11px;
      margin-top: 2px;
    }
    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 12px;
    }
    .menu-item {
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      color: rgba(255,255,255,0.8);
      border-left: 3px solid transparent;
    }
    .menu-item:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    .menu-item.active {
      background: rgba(212,175,55,0.15);
      border-left-color: #d4af37;
      color: #d4af37;
      font-weight: 600;
    }
    .main {
      display: flex;
      flex-direction: column;
      background: #f8f9fa;
    }
    .header {
      background: white;
      padding: 24px 32px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: #2c5aa0;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #2c5aa0;
      color: white;
    }
    .btn-primary:hover {
      background: #1f3f6b;
    }
    .btn-secondary {
      background: rgba(212,175,55,0.15);
      color: #d4af37;
      border: 1px solid #d4af37;
    }
    .content {
      padding: 32px;
      flex: 1;
      overflow-y: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: all 0.2s;
      cursor: pointer;
    }
    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transform: translateY(-2px);
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #2c3e50;
    }
    .card-meta {
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 8px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-active { background: #d4af37; color: #2c3e50; }
    .badge-pending { background: #3498db; color: white; }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .table th {
      background: #f8f9fa;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #7f8c8d;
      border-bottom: 2px solid #e0e0e0;
    }
    .table td {
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    .table tr:hover {
      background: #f8f9fa;
      cursor: pointer;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      max-width: 900px;
      width: 90%;
      max-height: 80vh;
      display: grid;
      grid-template-columns: 1fr 350px;
      overflow: hidden;
    }
    .modal-body {
      padding: 32px;
      overflow-y: auto;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #2c3e50;
    }
    .modal-sidebar {
      background: #f8f9fa;
      border-left: 1px solid #e0e0e0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 300px;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .message {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
      max-width: 85%;
    }
    .message.user {
      background: #2c5aa0;
      color: white;
      margin-left: auto;
    }
    .message.assistant {
      background: #e8f4f8;
      color: #2c3e50;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    .input-group input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
    }
    .input-group button {
      padding: 10px 16px;
      background: #2c5aa0;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    .hidden { display: none; }
    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .modal-content { grid-template-columns: 1fr; }
      .modal-sidebar { display: none; }
    }
  </style>
</head>

        { id: 4, cliente: 'Roberto García Pérez', caso: 'García vs. López', monto: 25000, estado: 'pendiente', fecha: '2026-11-25', descripcion: 'Honorarios - Segunda cuota' },
        { id: 5, cliente: 'Empresa López SRL', caso: 'Contrato Incumplido', monto: 75000, estado: 'cobrado', fecha: '2026-11-10', descripcion: 'Asesoramiento general' }

      selectedExpediente: null,
      legalChatMessages: [],
      newLegalDocDialog: false,
      monthlyReportDialog: false,
      monthlyReportStatus: null,
      selectedCaseDetail: null,
      documentGenerating: null,
      formData: {},
      configDialog: false,
      apiKey: localStorage.getItem('anthropic_api_key') || ''
    };

    const mockCitas = [
      { id: 1, fecha: '2026-11-21', hora: '14:30', caso: 'García vs. López', tipo: 'Audiencia', lugar: 'Juzgado Civil N° 3' },
      { id: 2, fecha: '2026-11-22', hora: '10:00', caso: 'López SRL - Incumplimiento', tipo: 'Contestación', lugar: 'Despacho' },
      { id: 3, fecha: '2026-11-25', hora: '15:00', caso: 'Denuncia Fernández', tipo: 'Investigación', lugar: 'Fiscalía' },
      { id: 4, fecha: '2026-11-28', hora: '11:00', caso: 'García vs. López', tipo: 'Seguimiento', lugar: 'Videoconferencia' }
    ];

    window.setState = function(updates) {
      window.state = { ...window.state, ...updates };
      render();
    };

    function render() {
      const root = document.getElementById('root');
      const state = window.state;
      if (!state.currentUser) {
        root.innerHTML = `
          <div style="display: grid; place-items: center; min-height: 100vh; background: linear-gradient(135deg, #2c5aa0 0%, #1f3f6b 100%);">
            <div style="background: white; padding: 40px; border-radius: 12px; text-align: center;">
              <div style="font-size: 32px; font-weight: 700; color: #2c5aa0; margin-bottom: 10px;">⚖️ GIMENEZ</div>
              <p style="color: #7f8c8d; margin-bottom: 32px;">Estudio Jurídico</p>

                <button class="btn btn-primary" onclick="setState({currentUser: 'juan'})" style="width: 300px; padding: 12px;">👤 Juan Manuel Gimenez</button>
                <button class="btn btn-primary" onclick="setState({currentUser: 'fabian'})" style="width: 300px; padding: 12px;">👤 Fabián Gimenez</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      root.innerHTML = `
        <div class="app">
          <div class="sidebar">
            <div>
              <div class="logo">⚖️ GIMENEZ</div>
              <div class="logo-sub">ESTUDIO JURÍDICO</div>
            </div>

            <div class="user-profile">
              <div class="user-profile-label">USUARIO</div>
              <div class="user-profile-name">${state.currentUser === 'juan' ? 'Juan Manuel' : 'Fabián'}</div>

            </div>

              <div class="menu-item ${state.currentView === 'casos' ? 'active' : ''}" onclick="setState({currentView: 'casos', selectedCase: null})">📁 Casos</div>
              <div class="menu-item ${state.currentView === 'expedientes' ? 'active' : ''}" onclick="setState({currentView: 'expedientes', selectedCase: null})">📋 Expedientes</div>
              <div class="menu-item ${state.currentView === 'tareas' ? 'active' : ''}" onclick="setState({currentView: 'tareas', selectedCase: null})">✅ Tareas</div>
              <div class="menu-item ${state.currentView === 'finanzas' ? 'active' : ''}" onclick="setState({currentView: 'finanzas', selectedCase: null})">💰 Finanzas</div>
              <div class="menu-item ${state.currentView === 'baseLegal' ? 'active' : ''}" onclick="setState({currentView: 'baseLegal', selectedCase: null})">📚 Base Legal</div>
              <div class="menu-item ${state.currentView === 'calendario' ? 'active' : ''}" onclick="setState({currentView: 'calendario', selectedCase: null})">📅 Calendario</div>
            </div>

            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding: 0 12px;">

                state.currentView === 'expedientes' ? '📋 Expedientes' :

                '📅 Calendario'
              }</h1>

                ${state.currentView === 'expedientes' ? `<button class="btn btn-primary" onclick="setState({newExpedienteDialog: true})">➕ Nuevo Expediente</button>` : ''}

    function renderDashboard() {
      const proximaCita = mockCitas.sort((a, b) => new Date(a.fecha) - new Date(b.fecha))[0];
      const fechaFormato = new Date(proximaCita.fecha).toLocaleDateString('es-AR', {weekday: 'long', month: 'long', day: 'numeric', year: 'numeric'});

      return `

              <div>

    function sendLegalConsulta() {
      const input = document.getElementById('legalChatInput');
      if (!input || !input.value.trim()) return;

      const userMessage = input.value.trim();
      input.value = '';

      setState({
        legalChatMessages: [...state.legalChatMessages, { type: 'user', text: userMessage }]
      });

      fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'legal',
          messages: [{ role: 'user', content: userMessage }]
        })
      })
      .then(res => res.json())
      .then(data => {
        setState({
          legalChatMessages: [...state.legalChatMessages, { type: 'assistant', text: data.message || 'Error en la respuesta' }]
        });
      })
      .catch(err => {
        setState({
          legalChatMessages: [...state.legalChatMessages, { type: 'assistant', text: `Error: ${err.message}` }]
        });
      });
    }

    window.sendCaseDetailMessage = function() {

      const msg = input.value.trim();
      input.value = '';

      window.setState({ chatMessages: [...window.state.chatMessages, { type: 'user', text: msg }] });

      fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          type: 'case',
          messages: [{ role: 'user', content: msg }]
        })
      })

      .then(data => {
        window.setState({ chatMessages: [...window.state.chatMessages, { type: 'assistant', text: data.message || 'Error en la respuesta' }] });
      })
      .catch(err => {
        window.setState({ chatMessages: [...window.state.chatMessages, { type: 'assistant', text: `Error: ${err.message}` }] });
      });

                <select style="width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 13px; background: white; color: #2c3e50;">
                  <option>Constitución</option>
                  <option>Código Civil y Comercial</option>
                  <option>Código Penal</option>
                  <option>Ley Laboral</option>
                  <option>Ley Comercial</option>
                  <option>Ley Procesal</option>
                  <option>Otra</option>
                </select>
              </div>
              <div>
                <label style="display: block; font-size: 11px; font-weight: 600; color: #7f8c8d; margin-bottom: 8px; text-transform: uppercase;">Año de Sanción</label>
                <input type="number" placeholder="2024" min="1800" max="2100" style="width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px;">
              </div>
            </div>

            <div style="margin-bottom: 20px;">
              <label style="display: block; font-size: 11px; font-weight: 600; color: #7f8c8d; margin-bottom: 8px; text-transform: uppercase;">Contenido / Texto Completo</label>
              <textarea placeholder="Pega aquí el contenido completo de la ley, decreto o norma. Este texto será utilizado por la IA para responder consultas." style="width: 100%; min-height: 200px; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 12px; resize: vertical;"></textarea>
            </div>

            <div style="margin-bottom: 20px;">
              <label style="display: block; font-size: 11px; font-weight: 600; color: #7f8c8d; margin-bottom: 8px; text-transform: uppercase;">O Cargar Archivo</label>
              <div style="padding: 20px; border: 2px dashed #d4af37; border-radius: 8px; text-align: center; cursor: pointer; background: #fffbea;">
                <div style="font-size: 32px; margin-bottom: 8px;">📄</div>
                <div style="font-size: 13px; color: #2c3e50; font-weight: 600;">Haz click para cargar PDF o Word</div>
                <div style="font-size: 11px; color: #7f8c8d; margin-top: 4px;">O arrastra un archivo aquí</div>
              </div>
            </div>

            <div style="display: flex; gap: 12px;">
              <button class="btn btn-primary" onclick="setState({newLegalDocDialog: false}); alert('✅ Documento agregado a la base de datos legal')" style="flex: 1; padding: 12px;">📚 Agregar a Base Legal</button>
              <button class="btn btn-secondary" onclick="setState({newLegalDocDialog: false})" style="flex: 1; padding: 12px;">Cancelar</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderConfigDialog() {
      return `
        <div class="modal" onclick="if(event.target === this) setState({configDialog: false})">
          <div style="background: white; border-radius: 12px; padding: 32px; max-width: 500px; width: 90%;" onclick="event.stopPropagation()">
            <h2 style="margin-top: 0; color: #2c5aa0;">⚙️ Configuración</h2>

            <div style="margin-bottom: 24px;">
              <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #2c3e50;">API Key de Claude</label>
              <p style="font-size: 12px; color: #7f8c8d; margin-top: 0; margin-bottom: 12px;">
                Obtén tu API key en <a href="https://console.anthropic.com/" target="_blank" style="color: #2c5aa0; text-decoration: none;">console.anthropic.com</a>
              </p>
              <input
                type="password"
                id="apiKeyInput"
                placeholder="sk-ant-..."
                value="${state.apiKey}"
                style="width: 100%; padding: 12px; border: 1px solid #e0e0e0; border-radius: 8px; font-size: 14px; font-family: monospace;"
              >
            </div>

            <div style="display: flex; gap: 12px;">
              <button class="btn btn-primary" onclick="
                const key = document.getElementById('apiKeyInput').value;
                localStorage.setItem('anthropic_api_key', key);
                setState({apiKey: key, configDialog: false});
              " style="flex: 1;">💾 Guardar</button>
              <button class="btn btn-secondary" onclick="setState({configDialog: false})" style="flex: 1;">Cerrar</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderMonthlyReportDialog() {
      return `
        <div class="modal" onclick="if(event.target === this) setState({monthlyReportDialog: false})">
          <div style="background: white; border-radius: 12px; padding: 32px; max-width: 700px; width: 90%; max-height: 90vh; overflow-y: auto;" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
              <h2 style="margin: 0; color: #2c5aa0;">📧 Informe Mensual - ${new Date().toLocaleDateString('es-AR', {month: 'long', year: 'numeric'})}</h2>
              <button class="close-btn" onclick="setState({monthlyReportDialog: false})">✕</button>
            </div>

            <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 24px;">
              <h3 style="margin: 0 0 12px 0; color: #2c5aa0; font-size: 14px;">📋 PREVIEW DEL INFORME</h3>
              <div style="background: white; padding: 16px; border-radius: 6px; font-size: 13px; line-height: 1.6; color: #555;">
                <p style="margin: 0 0 12px 0;"><strong>Cliente:</strong> ${state.selectedClient.name}</p>
                <p style="margin: 0 0 12px 0;"><strong>Período:</strong> ${new Date().toLocaleDateString('es-AR', {month: 'long', year: 'numeric'})}</p>
                <p style="margin: 0 0 12px 0;"><strong>Casos Activos:</strong> ${state.selectedClient.casos}</p>
                <hr style="border: none; border-top: 1px solid #e0e0e0; margin: 12px 0;">
                <p style="margin: 0;"><strong>Resumen:</strong> Se adjunta informe detallado con estado de los casos, próximas actuaciones y recomendaciones legales.</p>
              </div>
            </div>

            <div style="margin-bottom: 24px;">
              <label style="display: block; font-size: 11px; font-weight: 600; color: #7f8c8d; margin-bottom: 8px; text-transform: uppercase;">NOTAS ADICIONALES (opcional)</label>
              <textarea placeholder="Agregar detalles específicos para este informe..." style="width: 100%; min-height: 100px; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 13px; resize: vertical;"></textarea>
            </div>

            <div style="background: #e8f4f8; padding: 16px; border-radius: 8px; margin-bottom: 24px; border-left: 4px solid #2c5aa0;">
              <h4 style="margin: 0 0 8px 0; color: #2c5aa0; font-size: 12px;">⚙️ FLUJO DE APROBACIÓN</h4>
              <div style="font-size: 12px; color: #555; line-height: 1.6;">
                <p style="margin: 4px 0;">✅ <strong>Paso 1:</strong> Enviar al correo del abogado (${state.currentUser === 'juan' ? 'juan@estudiogimenez.ar' : 'fabian@estudiogimenez.ar'})</p>
                <p style="margin: 4px 0;">⏳ <strong>Paso 2:</strong> Abogado revisa y confirma</p>
                <p style="margin: 4px 0;">📧 <strong>Paso 3:</strong> Se envía automáticamente al cliente (${state.selectedClient.email})</p>
              </div>
            </div>

            <div style="display: flex; gap: 12px;">
              <button class="btn btn-primary" onclick="sendMonthlyReport()" style="flex: 1; padding: 12px;">📧 Enviar al Abogado para Aprobación</button>
              <button class="btn btn-secondary" onclick="setState({monthlyReportDialog: false})" style="flex: 1; padding: 12px;">Cancelar</button>
            </div>
          </div>
        </div>
      `;
    }

    function sendMonthlyReport() {
      setState({
        monthlyReportDialog: false,
        monthlyReportStatus: 'Enviado al abogado - Pendiente de aprobación'
      });
      alert(`✅ Informe enviado a ${state.currentUser === 'juan' ? 'Juan Manuel' : 'Fabián'}\n\n📧 El abogado recibirá un email para revisar y confirmar.\n\nUna vez aprobado, se reenviará automáticamente a:\n${state.selectedClient.email}`);
    }

    function sendClientMessage() {
      const input = document.getElementById('clientChatInput');
      if (input && input.value.trim()) {
        setState({
          clientChatMessages: [...state.clientChatMessages, { type: 'user', text: input.value }]
        });
        input.value = '';
        setTimeout(() => {
          setState({
            clientChatMessages: [...state.clientChatMessages, { type: 'assistant', text: '✍️ Analizando cliente... (IA conectada próximamente)' }]
          });
        }, 500);
      }
    }

    render();
  </script>
</body>
</html>
