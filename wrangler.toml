name = "estudio-gimenez"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# La página se sirve tal cual desde public/. El worker corre primero (contraseña + API).
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# Archivos de clientes: almacenamiento TEMPORAL hasta conectar Google Drive.
[[kv_namespaces]]
binding = "ARCHIVOS"
id = "0b3c17bdd2ca44d8882cc1c5ce8fa195"

# Antes de cada deploy/dev: si public/index.html tiene un error de JavaScript, el deploy se cancela.
[build]
command = "node check-html.js"
