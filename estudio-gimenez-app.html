<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio Jurídico Gimenez</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f8f9fa;
      color: #2c3e50;
    }

    .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .sidebar {
      background: linear-gradient(180deg, #2c5aa0 0%, #1f3f6b 100%);
      color: white;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      gap: 32px;
      box-shadow: 2px 0 8px rgba(0,0,0,0.1);
    }
    .logo {
      padding: 0 20px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .logo-sub {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 4px;
      letter-spacing: 0.5px;
    }
    .user-profile {
      padding: 12px 20px;
      margin: 0 12px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 8px;
      font-size: 12px;
    }
    .user-profile-label {
      opacity: 0.8;
      margin-bottom: 4px;
    }
    .user-profile-name {
      font-weight: 600;
      font-size: 14px;
      margin-top: 2px;
    }
    .user-profile-role {
      color: #d4af37;
      font-size: 11px;
      margin-top: 2px;
    }
    .menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 0 12px;
    }
    .menu-item {
      padding: 12px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      transition: all 0.2s;
      color: rgba(255,255,255,0.8);
      border-left: 3px solid transparent;
    }
    .menu-item:hover {
      background: rgba(255,255,255,0.1);
      color: white;
    }
    .menu-item.active {
      background: rgba(212,175,55,0.15);
      border-left-color: #d4af37;
      color: #d4af37;
      font-weight: 600;
    }
    .main {
      display: flex;
      flex-direction: column;
      background: #f8f9fa;
    }
    .header {
      background: white;
      padding: 24px 32px;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header h1 {
      margin: 0;
      font-size: 28px;
      font-weight: 700;
      color: #2c5aa0;
    }
    .header-actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: all 0.2s;
    }
    .btn-primary {
      background: #2c5aa0;
      color: white;
    }
    .btn-primary:hover {
      background: #1f3f6b;
    }
    .btn-secondary {
      background: rgba(212,175,55,0.15);
      color: #d4af37;
      border: 1px solid #d4af37;
    }
    .btn-secondary:hover {
      background: rgba(212,175,55,0.25);
    }
    .content {
      padding: 32px;
      flex: 1;
      overflow-y: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    .card {
      background: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      transition: all 0.2s;
      cursor: pointer;
    }
    .card:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.12);
      transform: translateY(-2px);
    }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #2c3e50;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-active { background: #d4af37; color: #2c3e50; }
    .badge-pending { background: #3498db; color: white; }
    .badge-closed { background: #27ae60; color: white; }
    .card-meta {
      font-size: 12px;
      color: #7f8c8d;
      margin-top: 8px;
    }
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal-content {
      background: white;
      border-radius: 12px;
      max-width: 900px;
      width: 90%;
      max-height: 80vh;
      display: grid;
      grid-template-columns: 1fr 350px;
      overflow: hidden;
    }
    .modal-body {
      padding: 32px;
      overflow-y: auto;
    }
    .modal-sidebar {
      background: #f8f9fa;
      border-left: 1px solid #e0e0e0;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .close-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: #2c3e50;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #7f8c8d;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-family: inherit;
      font-size: 14px;
    }
    .form-group textarea {
      resize: vertical;
      min-height: 100px;
    }
    .chat-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 12px;
    }
    .message {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.4;
    }
    .message.user {
      background: #2c5aa0;
      color: white;
      margin-left: auto;
      max-width: 85%;
    }
    .message.assistant {
      background: #e8f4f8;
      color: #2c3e50;
      max-width: 85%;
    }
    .input-group {
      display: flex;
      gap: 8px;
    }
    .input-group input {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      border-radius: 6px;
      font-size: 13px;
    }
    .input-group button {
      padding: 10px 16px;
      background: #2c5aa0;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }
    .table th {
      background: #f8f9fa;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      color: #7f8c8d;
      border-bottom: 2px solid #e0e0e0;
    }
    .table td {
      padding: 12px;
      border-bottom: 1px solid #e0e0e0;
    }
    .table tr:hover {
      background: #f8f9fa;
      cursor: pointer;
    }
    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .modal-content { grid-template-columns: 1fr; }
      .modal-sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [currentView, setCurrentView] = useState('dashboard');
      const [selectedCase, setSelectedCase] = useState(null);
      const [selectedClient, setSelectedClient] = useState(null);
      const [chatMessages, setChatMessages] = useState([]);
      const [chatInput, setChatInput] = useState('');

      const users = {
        juan: { name: 'Juan Manuel Gimenez', role: 'Abogado Principal' },
        fabian: { name: 'Fabián Gimenez', role: 'Abogado Asociado' }
      };

      const mockData = {
        clientes: [
          { id: 1, name: 'Roberto García Pérez', email: 'roberto@gmail.com', phone: '+54 2652 123456', casos: 2 },
          { id: 2, name: 'Empresa López SRL', email: 'contacto@lopez.com.ar', phone: '+54 2652 654321', casos: 3 },
          { id: 3, name: 'Mariana Fernández', email: 'mariana.f@hotmail.com', phone: '+54 2652 789123', casos: 1 }
        ],
        casos: [
          { id: 1, titulo: 'García vs. López', cliente: 'Roberto García Pérez', tipo: 'Civil', estado: 'activo', fecha: '15/11/2026' },
          { id: 2, titulo: 'Denuncia Fernández', cliente: 'Mariana Fernández', tipo: 'Penal', estado: 'pending', fecha: '20/11/2026' },
          { id: 3, titulo: 'Contrato Incumplido', cliente: 'Empresa López SRL', tipo: 'Comercial', estado: 'pending', fecha: '10/11/2026' },
          { id: 4, titulo: 'Sucesión Mendoza', cliente: 'Carlos Mendoza', tipo: 'Sucesión', estado: 'closed', fecha: '05/11/2026' }
        ]
      };

      function handleSendMessage() {
        if (chatInput.trim()) {
          setChatMessages([...chatMessages, { type: 'user', text: chatInput }]);
          setTimeout(() => {
            setChatMessages(prev => [...prev, {
              type: 'assistant',
              text: '📝 Generando documento... (Próximamente conectado con IA)'
            }]);
          }, 500);
          setChatInput('');
        }
      }

      if (!currentUser) {
        return (
          <div style={{ display: 'grid', placeItems: 'center', minHeight: '100vh', background: 'linear-gradient(135deg, #2c5aa0 0%, #1f3f6b 100%)' }}>
            <div style={{ background: 'white', padding: '40px', borderRadius: '12px', textAlign: 'center', maxWidth: '400px' }}>
              <div style={{ fontSize: '32px', fontWeight: '700', color: '#2c5aa0', marginBottom: '10px' }}>⚖️ GIMENEZ</div>
              <p style={{ color: '#7f8c8d', marginBottom: '32px' }}>Estudio Jurídico</p>
              <div style={{ display: 'grid', gap: '12px' }}>
                <button className="btn btn-primary" onClick={() => setCurrentUser('juan')} style={{ width: '100%', padding: '12px' }}>
                  👤 Juan Manuel
                </button>
                <button className="btn btn-primary" onClick={() => setCurrentUser('fabian')} style={{ width: '100%', padding: '12px' }}>
                  👤 Fabián
                </button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="app">
          <div className="sidebar">
            <div>
              <div className="logo">⚖️ GIMENEZ</div>
              <div className="logo-sub">ESTUDIO JURÍDICO</div>
            </div>

            <div className="user-profile">
              <div className="user-profile-label">USUARIO</div>
              <div className="user-profile-name">{users[currentUser].name}</div>
              <div className="user-profile-role">{users[currentUser].role}</div>
            </div>

            <div className="menu">
              <div className={`menu-item ${currentView === 'dashboard' ? 'active' : ''}`} onClick={() => { setCurrentView('dashboard'); setSelectedCase(null); setSelectedClient(null); }}>
                📋 Dashboard
              </div>
              <div className={`menu-item ${currentView === 'clientes' ? 'active' : ''}`} onClick={() => { setCurrentView('clientes'); setSelectedCase(null); setSelectedClient(null); }}>
                👥 Clientes
              </div>
              <div className={`menu-item ${currentView === 'casos' ? 'active' : ''}`} onClick={() => { setCurrentView('casos'); setSelectedCase(null); }}>
                📁 Casos
              </div>
              <div className={`menu-item ${currentView === 'documentos' ? 'active' : ''}`} onClick={() => setCurrentView('documentos')}>
                📄 Documentos
              </div>
            </div>

            <div style={{ marginTop: 'auto', paddingTop: '20px', borderTop: '1px solid rgba(255,255,255,0.1)', paddingLeft: '12px', paddingRight: '12px' }}>
              <button className="btn btn-secondary" onClick={() => setCurrentUser(null)} style={{ width: '100%' }}>
                🚪 Cerrar sesión
              </button>
            </div>
          </div>

          <div className="main">
            <div className="header">
              <h1>
                {currentView === 'dashboard' && '📊 Dashboard'}
                {currentView === 'clientes' && '👥 Clientes'}
                {currentView === 'casos' && '📁 Casos'}
                {currentView === 'documentos' && '📄 Documentos'}
              </h1>
              <div className="header-actions">
                <button className="btn btn-primary">➕ Nuevo</button>
              </div>
            </div>

            <div className="content">
              {currentView === 'dashboard' && (
                <div>
                  <div className="grid">
                    <div className="card">
                      <div className="card-header">
                        <div className="card-title">Casos Activos</div>
                        <div className="badge badge-active">8</div>
                      </div>
                      <div className="card-meta">En seguimiento y trámite</div>
                    </div>
                    <div className="card">
                      <div className="card-header">
                        <div className="card-title">Clientes</div>
                        <div className="badge badge-active">12</div>
                      </div>
                      <div className="card-meta">Activos en la cartera</div>
                    </div>
                    <div className="card">
                      <div className="card-header">
                        <div className="card-title">Próximas Audiencias</div>
                        <div className="badge badge-pending">3</div>
                      </div>
                      <div className="card-meta">En los próximos 7 días</div>
                    </div>
                  </div>

                  <div style={{ background: 'white', borderRadius: '12px', padding: '20px', boxShadow: '0 2px 8px rgba(0,0,0,0.08)' }}>
                    <h2 style={{ margin: '0 0 16px 0', color: '#2c5aa0', fontSize: '18px' }}>Últimos Casos</h2>
                    <table className="table">
                      <thead>
                        <tr>
                          <th>Caso</th>
                          <th>Cliente</th>
                          <th>Tipo</th>
                          <th>Estado</th>
                          <th>Fecha</th>
                        </tr>
                      </thead>
                      <tbody>
                        {mockData.casos.map(caso => (
                          <tr key={caso.id} onClick={() => { setSelectedCase(caso); setCurrentView('casos'); }}>
                            <td style={{ fontWeight: '600' }}>{caso.titulo}</td>
                            <td>{caso.cliente}</td>
                            <td>{caso.tipo}</td>
                            <td><span className={`badge badge-${caso.estado}`}>{caso.estado === 'activo' ? 'Activo' : caso.estado === 'pending' ? 'En Trámite' : 'Resuelto'}</span></td>
                            <td>{caso.fecha}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {currentView === 'clientes' && !selectedClient && (
                <div className="grid">
                  {mockData.clientes.map(cliente => (
                    <div key={cliente.id} className="card" onClick={() => setSelectedClient(cliente)}>
                      <div className="card-title">{cliente.name}</div>
                      <div className="card-meta">📧 {cliente.email}</div>
                      <div className="card-meta">📱 {cliente.phone}</div>
                      <div style={{ marginTop: '12px', fontSize: '13px', fontWeight: '600', color: '#d4af37' }}>{cliente.casos} caso(s)</div>
                    </div>
                  ))}
                </div>
              )}

              {currentView === 'casos' && !selectedCase && (
                <div style={{ background: 'white', borderRadius: '12px', padding: '20px', boxShadow: '0 2px 8px rgba(0,0,0,0.08)' }}>
                  <table className="table">
                    <thead>
                      <tr>
                        <th>Caso</th>
                        <th>Cliente</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Fecha</th>
                      </tr>
                    </thead>
                    <tbody>
                      {mockData.casos.map(caso => (
                        <tr key={caso.id} onClick={() => setSelectedCase(caso)}>
                          <td style={{ fontWeight: '600' }}>{caso.titulo}</td>
                          <td>{caso.cliente}</td>
                          <td>{caso.tipo}</td>
                          <td><span className={`badge badge-${caso.estado}`}>{caso.estado === 'activo' ? 'Activo' : caso.estado === 'pending' ? 'En Trámite' : 'Resuelto'}</span></td>
                          <td>{caso.fecha}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}

              {currentView === 'documentos' && (
                <div style={{ background: 'white', borderRadius: '12px', padding: '32px', textAlign: 'center', color: '#7f8c8d' }}>
                  <div style={{ fontSize: '48px', marginBottom: '12px' }}>📄</div>
                  <p>Sección de documentos en desarrollo</p>
                </div>
              )}
            </div>
          </div>

          {selectedCase && (
            <div className="modal" onClick={() => setSelectedCase(null)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="modal-body">
                  <button className="close-btn" onClick={() => setSelectedCase(null)}>✕</button>
                  <h1 style={{ margin: '0 0 24px 0', color: '#2c5aa0' }}>{selectedCase.titulo}</h1>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px', marginBottom: '24px' }}>
                    <div>
                      <label style={{ display: 'block', fontSize: '12px', color: '#7f8c8d', marginBottom: '4px', fontWeight: '600' }}>CLIENTE</label>
                      <div style={{ fontSize: '16px', fontWeight: '600' }}>{selectedCase.cliente}</div>
                    </div>
                    <div>
                      <label style={{ display: 'block', fontSize: '12px', color: '#7f8c8d', marginBottom: '4px', fontWeight: '600' }}>TIPO</label>
                      <div style={{ fontSize: '16px', fontWeight: '600' }}>{selectedCase.tipo}</div>
                    </div>
                  </div>

                  <div style={{ background: '#f8f9fa', borderRadius: '8px', padding: '16px', marginBottom: '24px' }}>
                    <h3 style={{ margin: '0 0 12px 0', color: '#2c5aa0' }}>Resumen del Caso</h3>
                    <p style={{ margin: 0, lineHeight: '1.6' }}>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
                  </div>

                  <div style={{ background: '#f8f9fa', borderRadius: '8px', padding: '16px' }}>
                    <h3 style={{ margin: '0 0 12px 0', color: '#2c5aa0' }}>Chat IA - Asistente Legal</h3>
                    <div className="chat-container">
                      <div className="messages">
                        {chatMessages.map((msg, i) => (
                          <div key={i} className={`message ${msg.type}`}>{msg.text}</div>
                        ))}
                      </div>
                      <div className="input-group">
                        <input
                          type="text"
                          placeholder="ej: 'Armame la contestación'"
                          value={chatInput}
                          onChange={e => setChatInput(e.target.value)}
                          onKeyPress={e => e.key === 'Enter' && handleSendMessage()}
                        />
                        <button onClick={handleSendMessage}>📤</button>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="modal-sidebar">
                  <div>
                    <label style={{ display: 'block', fontSize: '11px', fontWeight: '600', color: '#7f8c8d', marginBottom: '8px', textTransform: 'uppercase' }}>ESTADO</label>
                    <span className={`badge badge-${selectedCase.estado}`}>{selectedCase.estado === 'activo' ? 'Activo' : selectedCase.estado === 'pending' ? 'En Trámite' : 'Resuelto'}</span>
                  </div>

                  <div>
                    <label style={{ display: 'block', fontSize: '11px', fontWeight: '600', color: '#7f8c8d', marginBottom: '8px', textTransform: 'uppercase' }}>FECHA INICIO</label>
                    <div style={{ fontSize: '14px', fontWeight: '500' }}>{selectedCase.fecha}</div>
                  </div>

                  <div>
                    <label style={{ display: 'block', fontSize: '11px', fontWeight: '600', color: '#7f8c8d', marginBottom: '8px', textTransform: 'uppercase' }}>ACCIONES RÁPIDAS</label>
                    <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                      <button className="btn btn-secondary" style={{ width: '100%' }}>📝 Generar Demanda</button>
                      <button className="btn btn-secondary" style={{ width: '100%' }}>📋 Resumen del Caso</button>
                      <button className="btn btn-secondary" style={{ width: '100%' }}>💼 Estrategia Legal</button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {selectedClient && (
            <div className="modal" onClick={() => setSelectedClient(null)}>
              <div className="modal-content" onClick={e => e.stopPropagation()}>
                <div className="modal-body">
                  <button className="close-btn" onClick={() => setSelectedClient(null)}>✕</button>
                  <h1 style={{ margin: '0 0 24px 0', color: '#2c5aa0' }}>{selectedClient.name}</h1>

                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '24px', marginBottom: '24px' }}>
                    <div className="form-group">
                      <label>EMAIL</label>
                      <input type="email" defaultValue={selectedClient.email} disabled />
                    </div>
                    <div className="form-group">
                      <label>TELÉFONO</label>
                      <input type="text" defaultValue={selectedClient.phone} disabled />
                    </div>
                  </div>

                  <div style={{ marginBottom: '24px' }}>
                    <h3 style={{ color: '#2c5aa0', marginBottom: '12px' }}>Casos Asociados ({selectedClient.casos})</h3>
                    <div style={{ display: 'grid', gap: '12px' }}>
                      {mockData.casos.filter(c => c.cliente === selectedClient.name).map(caso => (
                        <div key={caso.id} className="card" onClick={() => { setSelectedCase(caso); setSelectedClient(null); }}>
                          <div style={{ fontWeight: '600', marginBottom: '8px' }}>{caso.titulo}</div>
                          <div style={{ fontSize: '12px', color: '#7f8c8d' }}>{caso.tipo} • {caso.fecha}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="form-group">
                    <label>NOTAS INTERNAS</label>
                    <textarea placeholder="Agregar notas sobre el cliente...">Cliente de confianza. Preferencia por audiencias en mañana.</textarea>
                  </div>

                  <button className="btn btn-primary">💾 Guardar Cambios</button>
                </div>

                <div className="modal-sidebar">
                  <div>
