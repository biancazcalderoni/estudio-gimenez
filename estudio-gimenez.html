<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estudio Jurídico Gimenez - CRM Legal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8f9fa; color: #2c3e50; }
    .app { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; }
    .sidebar { background: linear-gradient(180deg, #2c5aa0 0%, #1f3f6b 100%); color: white; padding: 24px 0; display: flex; flex-direction: column; gap: 32px; box-shadow: 2px 0 8px rgba(0,0,0,0.1); }
    .logo { padding: 0 20px; font-size: 20px; font-weight: 700; letter-spacing: 1px; }
    .logo-sub { font-size: 11px; opacity: 0.8; margin-top: 4px; letter-spacing: 0.5px; }
    .user-profile { padding: 12px 20px; margin: 0 12px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 8px; font-size: 12px; }
    .menu { display: flex; flex-direction: column; gap: 8px; padding: 0 12px; }
    .menu-item { padding: 12px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; transition: all 0.2s; color: rgba(255,255,255,0.8); border-left: 3px solid transparent; }
    .menu-item:hover { background: rgba(255,255,255,0.1); color: white; }
    .menu-item.active { background: rgba(212,175,55,0.15); border-left-color: #d4af37; color: #d4af37; font-weight: 600; }
    .main { display: flex; flex-direction: column; background: #f8f9fa; }
    .header { background: white; padding: 24px 32px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    .header h1 { margin: 0; font-size: 28px; font-weight: 700; color: #2c5aa0; }
    .btn { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; transition: all 0.2s; }
    .btn-primary { background: #2c5aa0; color: white; }
    .btn-primary:hover { background: #1f3f6b; }
    .btn-secondary { background: rgba(212,175,55,0.15); color: #d4af37; border: 1px solid #d4af37; }
    .content { padding: 32px; flex: 1; overflow-y: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 20px; margin-bottom: 24px; }
    .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); transition: all 0.2s; cursor: pointer; }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.12); transform: translateY(-2px); }
    .card-title { font-size: 16px; font-weight: 600; color: #2c3e50; }
    .card-meta { font-size: 12px; color: #7f8c8d; margin-top: 8px; }
    .table { width: 100%; border-collapse: collapse; font-size: 13px; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .table th { background: #f8f9fa; padding: 12px; text-align: left; font-weight: 600; color: #7f8c8d; border-bottom: 2px solid #e0e0e0; }
    .table td { padding: 12px; border-bottom: 1px solid #e0e0e0; }
    .table tr:hover { background: #f8f9fa; cursor: pointer; }
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .modal-content { background: white; border-radius: 12px; max-width: 900px; width: 90%; max-height: 80vh; display: grid; grid-template-columns: 1fr 350px; overflow: hidden; }
    .modal-body { padding: 32px; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 20px; right: 20px; background: none; border: none; font-size: 24px; cursor: pointer; color: #2c3e50; }
    .modal-sidebar { background: #f8f9fa; border-left: 1px solid #e0e0e0; padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
    .hidden { display: none; }
    @media (max-width: 768px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .modal-content { grid-template-columns: 1fr; }
      .modal-sidebar { display: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
    const mockData = {
      clientes: [
        { id: 1, name: 'Roberto Garcia Perez', email: 'roberto@gmail.com', phone: '+54 2652 123456', casos: 2, fecha: '2026-09-15', archivos: ['Contrato.pdf', 'Demanda.pdf'] },
        { id: 2, name: 'Empresa Lopez SRL', email: 'contacto@lopez.com.ar', phone: '+54 2652 654321', casos: 3, fecha: '2026-10-22', archivos: ['Acta.pdf', 'Resolucion.pdf'] },
        { id: 3, name: 'Mariana Fernandez', email: 'mariana.f@hotmail.com', phone: '+54 2652 789123', casos: 1, fecha: '2026-11-10', archivos: ['Denuncia.pdf'] }
      ],
      casos: [
        { id: 1, titulo: 'Garcia vs. Lopez', cliente: 'Roberto Garcia Perez', tipo: 'Civil', estado: 'activo', fecha: '15/11/2026' },
        { id: 2, titulo: 'Denuncia Fernandez', cliente: 'Mariana Fernandez', tipo: 'Penal', estado: 'pending', fecha: '20/11/2026' },
        { id: 3, titulo: 'Contrato Incumplido', cliente: 'Empresa Lopez SRL', tipo: 'Comercial', estado: 'pending', fecha: '10/11/2026' },
        { id: 4, titulo: 'Sucesion Mendoza', cliente: 'Carlos Mendoza', tipo: 'Sucesion', estado: 'closed', fecha: '05/11/2026' }
      ],
      baseLegal: [
        { id: 1, titulo: 'Constitucion Nacional Argentina', categoria: 'constitucion', año: 1994, articulos: 257 },
        { id: 2, titulo: 'Codigo Civil y Comercial', categoria: 'codigo', año: 2015, articulos: 2671 },
        { id: 3, titulo: 'Ley de Contrato de Trabajo 20744', categoria: 'ley laboral', año: 1974 },
        { id: 4, titulo: 'Codigo Penal', categoria: 'codigo', año: 1922, articulos: 400 }
      ],
      expedientes: [
        {
          id: 1, titulo: 'Garcia vs. Lopez - Expediente 2026-001', caso: 'Garcia vs. Lopez',
          demandante: { nombre: 'Roberto Garcia Perez', cuil: '27-45678901-2', dni: '45.678.901' },
          demandado: { nombre: 'Lopez Juan', cuil: '23-98765432-1', cuit: '23-98765432-9' },
          testigos: [
            { nombre: 'Maria Gonzalez', telefono: '+54 2652 111111', email: 'maria@gmail.com' }
          ],
          pliegos: ['Cual es el monto exacto de la deuda?', 'Desde que fecha se adeuda?']
        }
      ]
    };

    window.state = {
      currentUser: null,
      currentView: 'dashboard',
      selectedCase: null,
      selectedClient: null,
      selectedExpediente: null,
      newClientDialog: false,
      newCaseDialog: false,
      newExpedienteDialog: false,
      newLegalDocDialog: false,
      legalChatMessages: [],
      monthlyReportDialog: false,
      monthlyReportStatus: null
    };

    window.setState = function(updates) {
      window.state = { ...window.state, ...updates };
      render();
    };

    function render() {
      const s = window.state;
      if (!s.currentUser) {
        document.getElementById('root').innerHTML = `
          <div style="display: grid; place-items: center; min-height: 100vh; background: linear-gradient(135deg, #2c5aa0 0%, #1f3f6b 100%);">
            <div style="background: white; padding: 40px; border-radius: 12px; text-align: center;">
              <div style="font-size: 32px; font-weight: 700; color: #2c5aa0; margin-bottom: 10px;">GIMENEZ</div>
              <p style="color: #7f8c8d; margin-bottom: 32px;">Estudio Juridico</p>
              <div style="display: grid; gap: 12px;">
                <button class="btn btn-primary" onclick="window.setState({currentUser: 'juan'})" style="width: 300px; padding: 12px;">Juan Manuel Gimenez</button>
                <button class="btn btn-primary" onclick="window.setState({currentUser: 'fabian'})" style="width: 300px; padding: 12px;">Fabian Gimenez</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      document.getElementById('root').innerHTML = `
        <div class="app">
          <div class="sidebar">
            <div>
              <div class="logo">GIMENEZ</div>
              <div class="logo-sub">ESTUDIO JURIDICO</div>
            </div>
            <div class="menu">
              <div class="menu-item ${s.currentView === 'dashboard' ? 'active' : ''}" onclick="window.setState({currentView: 'dashboard'})">Dashboard</div>
              <div class="menu-item ${s.currentView === 'clientes' ? 'active' : ''}" onclick="window.setState({currentView: 'clientes'})">Clientes</div>
              <div class="menu-item ${s.currentView === 'casos' ? 'active' : ''}" onclick="window.setState({currentView: 'casos'})">Casos</div>
              <div class="menu-item ${s.currentView === 'expedientes' ? 'active' : ''}" onclick="window.setState({currentView: 'expedientes'})">Expedientes</div>
              <div class="menu-item ${s.currentView === 'baseLegal' ? 'active' : ''}" onclick="window.setState({currentView: 'baseLegal'})">Base Legal</div>
            </div>
            <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); padding: 0 12px;">
              <button class="btn btn-secondary" onclick="window.setState({currentUser: null})" style="width: 100%;">Cerrar sesion</button>
            </div>
          </div>

          <div class="main">
            <div class="header">
              <h1>${
                s.currentView === 'dashboard' ? 'Dashboard' :
                s.currentView === 'clientes' ? 'Clientes' :
                s.currentView === 'casos' ? 'Casos' :
                s.currentView === 'expedientes' ? 'Expedientes' :
                'Base Legal Argentina'
              }</h1>
              <div>
                ${s.currentView === 'clientes' ? '<button class="btn btn-primary" onclick="window.setState({newClientDialog: true})">Nuevo Cliente</button>' : ''}
                ${s.currentView === 'baseLegal' ? '<button class="btn btn-primary" onclick="window.setState({newLegalDocDialog: true})">Agregar Documento</button>' : ''}
              </div>
            </div>

            <div class="content">
              ${s.currentView === 'dashboard' ? renderDashboard() : ''}
              ${s.currentView === 'clientes' ? renderClientes() : ''}
              ${s.currentView === 'casos' ? renderCasos() : ''}
              ${s.currentView === 'expedientes' ? renderExpedientes() : ''}
              ${s.currentView === 'baseLegal' ? renderBaseLegal() : ''}
            </div>
          </div>
        </div>

        ${s.selectedExpediente ? renderExpedienteModal() : ''}
        ${s.newLegalDocDialog ? renderNewLegalDocDialog() : ''}
      `;
    }

    function renderDashboard() {
      return '<div style="text-align: center; color: #7f8c8d; padding: 60px;">Sistema de Gestion Legal - Estudio Gimenez</div>';
    }

    function renderClientes() {
      return `
        <div class="grid">
          ${mockData.clientes.map(c => `
            <div class="card">
              <div class="card-title">${c.name}</div>
              <div class="card-meta">Email: ${c.email}</div>
              <div class="card-meta">Telefono: ${c.phone}</div>
              <div style="margin-top: 12px; color: #d4af37; font-weight: 600;">${c.casos} caso(s)</div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderCasos() {
      return `
        <table class="table">
          <thead><tr><th>Caso</th><th>Cliente</th><th>Tipo</th><th>Estado</th><th>Fecha</th></tr></thead>
          <tbody>
            ${mockData.casos.map(c => `<tr><td>${c.titulo}</td><td>${c.cliente}</td><td>${c.tipo}</td><td>${c.estado}</td><td>${c.fecha}</td></tr>`).join('')}
          </tbody>
        </table>
      `;
    }

    function renderExpedientes() {
      return `
        <div class="grid" style="grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));">
          ${mockData.expedientes.map(exp => `
            <div class="card" onclick="setState({selectedExpediente: exp})">
              <div class="card-title">${exp.titulo}</div>
              <div class="card-meta">Caso: ${exp.caso}</div>
              <div style="margin-top: 12px; padding-top: 12px; border-top: 1px solid #e0e0e0;">
                <div style="font-size: 12px; font-weight: 600; color: #2c5aa0; margin-bottom: 4px;">PARTES:</div>
                <div style="font-size: 12px; color: #555;">Demandante: ${exp.demandante.nombre}</div>
                <div style="font-size: 12px; color: #555;">Demandado: ${exp.demandado.nombre}</div>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderExpedienteModal() {
      const exp = state.selectedExpediente;
      return `
        <div class="modal" onclick="if(event.target === this) setState({selectedExpediente: null})">
          <div style="background: white; border-radius: 12px; padding: 32px; max-width: 1000px; width: 95%; max-height: 90vh; overflow-y: auto;" onclick="event.stopPropagation()">
            <h2 style="margin: 0 0 20px 0; color: #2c5aa0;">${exp.titulo}</h2>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
              <div style="background: #f8f9fa; padding: 20px; border-radius: 8px;">
                <h3 style="margin: 0 0 16px 0; color: #2c5aa0;">DEMANDANTE</h3>
                <div style="font-weight: 600; margin-bottom: 12px;">${exp.demandante.nombre}</div>
                <div style="font-size: 12px; line-height: 1.8; color: #555;">
                  <div><strong>CUIL:</strong> ${exp.demandante.cuil}</div>
                  <div><strong>DNI:</strong> ${exp.demandante.dni}</div>
                </div>
              </div>

              <div style="background: #f8f9fa; padding: 20px; border-radius: 8px;">
                <h3 style="margin: 0 0 16px 0; color: #2c5aa0;">DEMANDADO</h3>
                <div style="font-weight: 600; margin-bottom: 12px;">${exp.demandado.nombre}</div>
                <div style="font-size: 12px; line-height: 1.8; color: #555;">
                  <div><strong>CUIT:</strong> ${exp.demandado.cuit}</div>
                  <div><strong>CUIL:</strong> ${exp.demandado.cuil}</div>
                </div>
              </div>
            </div>

            <div style="background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
              <h3 style="margin: 0 0 16px 0; color: #2c5aa0;">TESTIGOS (${exp.testigos.length})</h3>
              ${exp.testigos.map(t => `
                <div style="background: white; padding: 12px; border-radius: 6px; margin-bottom: 10px; border-left: 3px solid #d4af37;">
                  <div style="font-weight: 600;">${t.nombre}</div>
                  <div style="font-size: 12px; color: #555; margin-top: 6px;">Telefono: ${t.telefono}</div>
                  <div style="font-size: 12px; color: #555;">Email: ${t.email}</div>
                </div>
              `).join('')}
            </div>

            <button class="btn btn-secondary" onclick="setState({selectedExpediente: null})" style="width: 100%; padding: 12px;">Cerrar</button>
          </div>
        </div>
      `;
    }

    function renderBaseLegal() {
      return `
        <div style="display: grid; grid-template-columns: 350px 1fr; gap: 24px;">
          <div style="background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <h3 style="margin: 0 0 16px 0; color: #2c5aa0;">DOCUMENTOS LEGALES</h3>
            ${mockData.baseLegal.map(doc => `
              <div style="padding: 12px; background: #f8f9fa; border-radius: 6px; margin-bottom: 10px; cursor: pointer;">
                <div style="font-weight: 600; font-size: 12px;">${doc.titulo}</div>
                <div style="font-size: 11px; color: #7f8c8d;">${doc.categoria} - ${doc.año}</div>
                ${doc.articulos ? `<div style="font-size: 10px; color: #95a5a6; margin-top: 4px;">${doc.articulos} articulos</div>` : ''}
              </div>
            `).join('')}
          </div>

          <div style="background: white; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
            <h3 style="margin: 0 0 16px 0; color: #2c5aa0;">CONSULTAS LEGALES</h3>
            <div style="height: 300px; background: #f8f9fa; border-radius: 8px; padding: 16px; margin-bottom: 16px; overflow-y: auto;">
              ${state.legalChatMessages.length === 0 ?
                '<div style="text-align: center; color: #7f8c8d;">Haz preguntas sobre leyes argentinas</div>' :
                state.legalChatMessages.map(msg => `
                  <div style="text-align: ${msg.type === 'user' ? 'right' : 'left'}; margin-bottom: 10px;">
                    <div style="display: inline-block; max-width: 80%; padding: 10px; border-radius: 8px; background: ${msg.type === 'user' ? '#2c5aa0' : '#e8f4f8'}; color: ${msg.type === 'user' ? 'white' : '#2c3e50'}; font-size: 12px;">
                      ${msg.text}
                    </div>
                  </div>
                `).join('')
              }
            </div>
            <div style="display: flex; gap: 8px;">
              <input type="text" id="legalChatInput" placeholder="Pregunta legal..." style="flex: 1; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 12px;" onkeypress="if(event.key==='Enter') sendLegalConsulta()">
              <button onclick="sendLegalConsulta()" class="btn btn-primary">Enviar</button>
            </div>
          </div>
        </div>
      `;
    }

    window.sendLegalConsulta = function() {
      const input = document.getElementById('legalChatInput');
      if (!input || !input.value.trim()) return;

      const msg = input.value.trim();
      input.value = '';

      window.setState({ legalChatMessages: [...window.state.legalChatMessages, { type: 'user', text: msg }] });

      setTimeout(() => {
        const respuestas = [
          'Segun el CC: El plazo es de 10 dias habiles para contestar una demanda.',
          'Por Ley 20.744: El trabajador tiene protecciones especiales en incumplimientos.',
          'En materia procesal: La competencia se determina por domicilio del demandado.'
        ];
        const resp = respuestas[Math.floor(Math.random() * respuestas.length)];
        window.setState({ legalChatMessages: [...window.state.legalChatMessages, { type: 'assistant', text: resp }] });
      }, 500);
    };

    function renderNewLegalDocDialog() {
      return `
        <div class="modal" onclick="if(event.target === this) setState({newLegalDocDialog: false})">
          <div style="background: white; border-radius: 12px; padding: 32px; max-width: 700px; width: 95%;" onclick="event.stopPropagation()">
            <h2 style="margin: 0 0 20px 0; color: #2c5aa0;">Agregar Documento Legal</h2>

            <div style="margin-bottom: 16px;">
              <label style="display: block; font-size: 11px; font-weight: 600; color: #7f8c8d; margin-bottom: 8px;">Titulo</label>
              <input type="text" placeholder="Nombre de la ley o codigo" style="width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px;">
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px;">
              <div>
                <label style="display: block; font-size: 11px; font-weight: 600; color: #7f8c8d; margin-bottom: 8px;">Categoria</label>
                <select style="width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 13px; background: white;">
                  <option>Constitucion</option>
                  <option>Codigo</option>
                  <option>Ley</option>
                  <option>Decreto</option>
                </select>
              </div>
              <div>
                <label style="display: block; font-size: 11px; font-weight: 600; color: #7f8c8d; margin-bottom: 8px;">Año</label>
                <input type="number" placeholder="2024" style="width: 100%; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 14px;">
              </div>
            </div>

            <div style="margin-bottom: 16px;">
              <label style="display: block; font-size: 11px; font-weight: 600; color: #7f8c8d; margin-bottom: 8px;">Contenido</label>
              <textarea placeholder="Pega el contenido completo..." style="width: 100%; min-height: 150px; padding: 10px; border: 1px solid #e0e0e0; border-radius: 6px; font-size: 12px;"></textarea>
            </div>

            <div style="display: flex; gap: 12px;">
              <button class="btn btn-primary" onclick="setState({newLegalDocDialog: false}); alert('Documento agregado')" style="flex: 1;">Agregar</button>
              <button class="btn btn-secondary" onclick="setState({newLegalDocDialog: false})" style="flex: 1;">Cancelar</button>
            </div>
          </div>
        </div>
      `;
    }

    render();
  </script>
</body>
</html>
